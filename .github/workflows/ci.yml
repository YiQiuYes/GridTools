name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 同一分支的多次推送只保留最新一次运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- 代码审查：Android Lint 静态检查 ----------
  lint:
    name: Code Review (Android Lint)
    runs-on: ubuntu-latest
    env:
      version: ${{ inputs.version }}
      ALIAS: ${{ secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up signing environment
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        # The module-level `file("key.jks")` in signingConfigs resolves to app/key.jks.
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "SIGNING_KEY secret is not set; release APK will be unsigned" >&2
          else
            echo "$SIGNING_KEY" | base64 -d > app/key.jks
          fi

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      # 无论成功失败都上传报告，方便在 PR 里查看
      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  # ---------- 构建：编译 APK + 单元测试 ----------
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      version: ${{ inputs.version }}
      ALIAS: ${{ secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up signing environment
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        # The module-level `file("key.jks")` in signingConfigs resolves to app/key.jks.
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "SIGNING_KEY secret is not set; release APK will be unsigned" >&2
          else
            echo "$SIGNING_KEY" | base64 -d > app/key.jks
          fi

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 14
